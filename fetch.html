<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>사용자 목록</title>
</head>
<body>
    <h1>사용자 목록</h1>
    <!-- 목록이 렌더링될 영역 -->
    <div id="app"></div>

    <script>
        /*
         * [코드 설명]
         * 1. fetchJson(url)
         *    - 비동기 함수(async). fetch()로 URL에 GET 요청을 보내고 JSON으로 변환해 반환한다.
         *    - await: 응답/변환이 끝날 때까지 기다린다.
         *    - response.ok가 false(404, 500 등)이면 에러를 던져 호출부에서 처리한다.
         *    - 어떤 URL에도 쓸 수 있는 재사용 가능한 범용 함수.
         *
         * 2. renderList(items, container, formatter)
         *    - 데이터 배열을 ul/li 목록으로 만들어 container에 출력하는 재사용 함수.
         *    - formatter: 항목 하나를 li에 표시할 문자열로 바꾸는 콜백.
         *    - textContent를 사용해 HTML 삽입(XSS)을 방지한다.
         *
         * 3. showUsers(url, selector)
         *    - fetchJson + renderList를 조합하는 비동기 함수.
         *    - 로딩 메시지 표시 → 데이터 요청 → 목록 출력, 실패 시 try/catch로 오류 메시지 표시.
         *
         * 4. 마지막 줄에서 showUsers를 호출해 실행한다.
         */

        // 1. URL로 요청을 보내고 JSON 데이터를 반환하는 재사용 가능한 비동기 함수
        async function fetchJson(url) {
            const response = await fetch(url);          // 요청 전송 후 응답 대기
            if (!response.ok) {                         // HTTP 오류 상태 처리
                throw new Error(`요청 실패: ${response.status}`);
            }
            return await response.json();               // 응답 본문을 JSON으로 변환
        }

        // 2. 배열을 ul > li 목록으로 만들어 container에 출력하는 함수
        function renderList(items, container, formatter) {
            const ul = document.createElement('ul');   // ul 요소 생성
            items.forEach(item => {
                const li = document.createElement('li'); // 항목마다 li 생성
                li.textContent = formatter(item);        // 표시할 문자열 지정
                ul.appendChild(li);                      // ul에 li 추가
            });
            container.replaceChildren(ul);               // 기존 내용을 지우고 ul 출력
        }

        // 3. 데이터 요청과 화면 출력을 연결하는 비동기 함수
        async function showUsers(url, selector) {
            const container = document.querySelector(selector);
            container.textContent = '로딩 중...';
            try {
                const users = await fetchJson(url);
                renderList(users, container, user => `${user.name} (${user.email})`);
            } catch (error) {
                container.textContent = `오류가 발생했습니다: ${error.message}`;
            }
        }

        // 4. 실행
        showUsers('https://jsonplaceholder.typicode.com/users', '#app');
    </script>
</body>
</html>
