<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Photos Grid</title>
    <style>
        /* 5열 그리드: 10장이면 자동으로 2행이 된다 */
        #gallery {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 10px;
            max-width: 900px;
            margin: 20px auto;
        }
        .photo { text-align: center; font-size: 12px; }
        .photo img { width: 100%; display: block; cursor: pointer; }

        /* 팝업: 화면 전체를 덮는 반투명 배경, 내용은 flex로 정중앙 배치 */
        #modal {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.7);
            justify-content: center;
            align-items: center;
            z-index: 100;
        }
        #modal.open { display: flex; }
        .modal-content {
            position: relative;
            background: #fff;
            padding: 16px;
            border-radius: 8px;
            max-width: 90vw;
            max-height: 90vh;
            text-align: center;
        }
        .modal-content img { max-width: 100%; max-height: 70vh; display: block; margin: 0 auto 8px; }
        .modal-close {
            position: absolute;
            top: 6px;
            right: 10px;
            border: none;
            background: none;
            font-size: 28px;
            line-height: 1;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <div id="gallery"></div>

    <!-- 확대 팝업 -->
    <div id="modal">
        <div class="modal-content">
            <button class="modal-close" id="modalClose" aria-label="닫기">&times;</button>
            <img id="modalImg" src="" alt="">
            <p id="modalTitle"></p>
        </div>
    </div>

    <script>
        /*
         * fetchData(url)
         *  - 범용 비동기 함수: url로 GET 요청을 보내고 JSON을 파싱해 반환한다.
         *  - await fetch(url): 응답(Response)이 도착할 때까지 대기한다.
         *  - response.ok: HTTP 상태가 200~299인지 확인, 아니면 에러를 던진다.
         *  - await response.json(): 응답 본문을 JS 객체/배열로 변환한다.
         */
        async function fetchData(url) {
            const response = await fetch(url);
            if (!response.ok) {
                throw new Error(`요청 실패: ${response.status}`);
            }
            return await response.json();
        }

        /*
         * renderPhotos(photos, container, rows, cols)
         *  - 사진 배열을 받아 container 안에 이미지를 출력하는 재사용 함수.
         *  - rows * cols 개수만큼만 slice로 잘라 사용한다 (2행 5열 = 10장).
         *  - 이미지 URL은 photo.thumbnailUrl 사용 (url보다 가벼움).
         *  - grid-template-columns를 cols 값으로 지정해 열 수를 맞춘다.
         */
        function renderPhotos(photos, container, rows, cols) {
            container.style.gridTemplateColumns = `repeat(${cols}, 1fr)`;
            container.innerHTML = photos
                .slice(0, rows * cols)
                .map(photo => `
                    <div class="photo">
                        <img src="${photo.thumbnailUrl}" alt="${photo.title}"
                             data-full="${photo.url}" data-title="${photo.title}">
                        <p>${photo.id}</p>
                    </div>`)
                .join('');
        }

        /*
         * showPhotos(url, rows, cols)
         *  - 위 두 함수를 조합한 메인 함수. 행/열 수만 바꿔 재사용할 수 있다.
         *  - try/catch: 네트워크/응답 오류가 나면 화면에 메시지를 출력한다.
         */
        async function showPhotos(url, rows, cols) {
            const gallery = document.getElementById('gallery');
            try {
                const photos = await fetchData(url);
                renderPhotos(photos, gallery, rows, cols);
            } catch (error) {
                gallery.textContent = `오류: ${error.message}`;
            }
        }

        /*
         * 팝업 열기/닫기
         *  - 이벤트 위임: gallery 하나에만 click 리스너를 달아 동적으로 생성된 카드도 처리한다.
         *  - 큰 이미지는 data-full(photo.url)을 사용한다.
         *  - 닫기: X 버튼, 배경(어두운 영역) 클릭, ESC 키.
         */
        const modal = document.getElementById('modal');

        function closeModal() {
            modal.classList.remove('open');
        }

        document.getElementById('gallery').addEventListener('click', event => {
            const card = event.target.closest('.photo');
            if (!card) return;
            const img = card.querySelector('img');
            document.getElementById('modalImg').src = img.dataset.full;
            document.getElementById('modalImg').alt = img.dataset.title;
            document.getElementById('modalTitle').textContent = img.dataset.title;
            modal.classList.add('open');
        });

        document.getElementById('modalClose').addEventListener('click', closeModal);
        modal.addEventListener('click', event => {
            if (event.target === modal) closeModal();
        });
        document.addEventListener('keydown', event => {
            if (event.key === 'Escape') closeModal();
        });

        // 실행: 2행 5열로 출력
        showPhotos('https://jsonplaceholder.typicode.com/photos', 2, 5);
    </script>
</body>
</html>
